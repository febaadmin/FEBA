# ══════════════════════════════════════════════════════════════════════
# meet.globalfeba.com — Jitsi servi par le reverse proxy FEBA
#
# À N'ACTIVER QUE dans la topologie « même serveur », c'est-à-dire avec
# docker-compose.jitsi.behind-proxy.yml. Sur un serveur DÉDIÉ à Jitsi,
# c'est la surcouche docker-compose.jitsi.prod.yml qui s'occupe de tout
# et ce fichier ne sert pas.
#
# CE FICHIER N'EST PAS CHARGÉ TANT QU'IL N'EST PAS ACTIVÉ.
#
# C'est délibéré, et ce n'est pas de la prudence excessive : il référence
# un certificat pour meet.globalfeba.com. Tant que ce certificat n'existe
# pas, nginx REFUSE DE DÉMARRER — et comme c'est le même nginx qui sert
# globalfeba.com, livrer ce fichier « actif » ferait tomber le site
# principal au premier redémarrage, pour une fonctionnalité qui n'est pas
# encore en service.
#
# ACTIVATION (dans cet ordre) :
#
#   1. DNS      : A meet -> IP du serveur   (MANUAL_PRODUCTION_ACTIONS.md)
#   2. Certificat :
#        certbot certonly --webroot -w /var/www/certbot -d meet.globalfeba.com
#   3. Activation :
#        cp nginx/sites-available/meet.globalfeba.com.conf nginx/sites-enabled/
#   4. Contrôle AVANT rechargement — le site principal en dépend :
#        docker compose -f docker-compose.prod.yml exec nginx-prod nginx -t
#   5. docker compose -f docker-compose.prod.yml exec nginx-prod nginx -s reload
#
# L'étape 4 n'est pas une formalité : c'est la seule chose qui sépare une
# erreur de configuration d'une interruption du site.
# ══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name meet.globalfeba.com;

    # Renouvellement ACME (webroot) : doit rester accessible en clair.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Même forme que le vhost principal (`listen ... ssl http2`) : la
    # directive « http2 on; » n'existe qu'à partir de nginx 1.25, et ce
    # fichier est chargé par le MÊME nginx que globalfeba.com. Une
    # directive inconnue n'est pas un avertissement : nginx refuse de
    # démarrer, et le site principal tombe avec lui.
    listen 443 ssl http2;
    server_name meet.globalfeba.com;

    ssl_certificate     /etc/letsencrypt/live/meet.globalfeba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.globalfeba.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PAS de « X-Frame-Options: DENY » ici, contrairement au vhost
    # principal : l'application FEBA affiche la salle DANS UNE IFRAME.
    # Interdire l'encadrement rendrait la visioconférence inutilisable
    # depuis l'écran « Salles virtuelles ». On restreint donc les
    # encadreurs autorisés au lieu de les interdire tous.
    add_header Content-Security-Policy "frame-ancestors 'self' https://globalfeba.com https://www.globalfeba.com" always;

    # Jitsi charge sa propre interface : pas de limite basse sur les
    # tailles de corps, et des délais longs pour les connexions
    # persistantes.
    client_max_body_size 0;

    # ── Signalisation temps réel ──────────────────────────────────────
    #
    # Ces trois emplacements sont ce qui distingue un proxy Jitsi qui
    # marche d'un proxy où « tout le monde entre et personne ne se voit ».
    # Sans la mise à niveau WebSocket, la salle s'affiche et reste vide.

    # WebSocket XMPP (signalisation principale)
    location = /xmpp-websocket {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        tcp_nodelay on;
    }

    # WebSocket du pont vidéo (colibri)
    location ~ ^/colibri-ws/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        tcp_nodelay on;
    }

    # BOSH — repli de signalisation quand le WebSocket est bloqué par un
    # pare-feu d'entreprise. Une famille derrière un réseau restrictif en
    # dépend : ce n'est pas un vestige.
    location = /http-bind {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── Interface web ─────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Jitsi compose ses URL d'après cet en-tête. Sans lui, il sert des
        # ressources « http:// » depuis une page « https:// » : le
        # navigateur les bloque et la salle reste noire.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
