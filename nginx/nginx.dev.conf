events { worker_connections 1024; }
http {
    server {
        listen 80;
        location /api/ { proxy_pass http://backend-dev:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /ws/ { proxy_pass http://backend-dev:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
        location / { proxy_pass http://frontend-dev:5173; proxy_set_header Host $host; }
    }
}