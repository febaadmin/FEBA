user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Vhosts additionnels ───────────────────────────────────────────
    #
    # Vide par défaut. Sert à activer meet.globalfeba.com quand Jitsi
    # tourne SUR CE MÊME SERVEUR (topologie « derrière le proxy », voir
    # docker-compose.jitsi.behind-proxy.yml). Le vhost prêt à l'emploi est
    # livré dans nginx/sites-available/ et n'est PAS chargé tant qu'il
    # n'est pas copié dans sites-enabled/ : il référence un certificat qui
    # n'existe pas encore, et nginx refuserait de démarrer — ce nginx-ci
    # servant aussi globalfeba.com.
    #
    # Un motif qui ne correspond à aucun fichier n'est pas une erreur pour
    # nginx : le comportement par défaut reste donc strictement inchangé.
    include /etc/nginx/sites-enabled/*.conf;

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name globalfeba.com www.globalfeba.com;

        ssl_certificate /etc/letsencrypt/live/globalfeba.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/globalfeba.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # ── Flyer officiel FEBA FHA — TÉLÉCHARGEMENT GARANTI ──────────
        #
        # Le lien « Voir le détail des formules » porte déjà `download`.
        # Cet attribut est ignoré par une partie des navigateurs mobiles,
        # qui affichent alors le PDF au lieu de l'enregistrer. L'en-tête
        # ci-dessous rend le téléchargement indépendant du navigateur :
        # c'est le serveur qui déclare la pièce jointe.
        #
        # `application/pdf` est posé explicitement : `default_type` vaut
        # `application/octet-stream` en amont, et un flyer servi en type
        # binaire générique perd son icône et son aperçu.
        location = /images/feba-fha/feba-fha-flyer.pdf {
            proxy_pass http://frontend-prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Content-Disposition;
            add_header Content-Type application/pdf always;
            add_header Content-Disposition
                'attachment; filename="FEBA-French-Heritage-Academy-flyer.pdf"' always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Frontend SPA (served by frontend-prod nginx container)
        location / {
            proxy_pass http://frontend-prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (Django collectstatic)
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /var/www/media/;
            expires 30d;
        }

        # API
        location /api/ {
            proxy_pass http://backend-prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Django admin
        location /django-admin/ {
            proxy_pass http://backend-prod:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets
        location /ws/ {
            proxy_pass http://backend-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /api/health/ {
            proxy_pass http://backend-prod:8000;
	    proxy_set_header Host $host;
    	    proxy_set_header X-Real-IP $remote_addr;
    	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	    proxy_set_header X-Forwarded-Proto $scheme;

        }
    }
}
