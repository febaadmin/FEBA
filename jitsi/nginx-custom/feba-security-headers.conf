# ══════════════════════════════════════════════════════════════════════
# En-têtes de sécurité FEBA — pour le nginx DU CONTENEUR jitsi/web.
#
# POURQUOI CE FICHIER, ALORS QUE nginx/sites-available/ EXISTE DÉJÀ
# ------------------------------------------------------------------
# Le dépôt porte DEUX topologies Jitsi, et elles ne servent pas par le
# même nginx :
#
#   docker-compose.jitsi.prod.yml         → 80:80 et 443:443 publiés
#                                            directement : c'est le nginx
#                                            DU CONTENEUR qui répond.
#   docker-compose.jitsi.behind-proxy.yml → 127.0.0.1:8443 : un nginx
#                                            HÔTE répond, avec
#                                            nginx/sites-available/.
#
# meet.globalfeba.com renvoie « max-age=63072000 », « x-xss-protection »
# et « permissions-policy: interest-cohort=() » : la signature exacte du
# gabarit de jitsi/web. La production tourne donc sur la PREMIÈRE
# topologie, et le fichier nginx/sites-available/ — parfaitement correct —
# n'y est simplement jamais lu.
#
# D'où ce fichier : le point d'extension prévu par l'image, monté dans
# `/run/web/config/nginx-custom/`, que son gabarit inclut au niveau
# `server` (`include /run/web/config/nginx-custom/*.conf;`).
#
# CE QU'ON N'ÉCRIT PAS ICI, ET POURQUOI
# -------------------------------------
# Pas de Content-Security-Policy complète. Jitsi Meet a besoin de `eval`,
# de scripts en ligne, de blobs et de workers : une CSP « propre » rend
# l'instance muette et noire. La seule directive utile ici est
# `frame-ancestors`, qui ne touche PAS à l'exécution du code — elle est
# posée séparément par la variable CSP_HEADER (voir
# docker-compose.jitsi.prod.yml).
#
# Pas de Permissions-Policy restrictive non plus. `camera=()` ou
# `microphone=()` couperait la caméra et le micro de la conférence : ce
# serait désactiver la fonctionnalité pour la sécuriser.
# ══════════════════════════════════════════════════════════════════════

# Ce que le navigateur envoie comme référent en quittant une salle. Une
# URL de salle contient le nom du cours : elle n'a pas à voyager vers un
# site tiers.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# `always` : le gabarit de l'image pose ces deux en-têtes SANS `always`,
# donc uniquement sur les réponses 2xx/3xx. Une page d'erreur 4xx/5xx en
# était dépourvue. On les repose ici pour qu'ils couvrent aussi ces
# réponses — nginx additionne les `add_header` d'un même niveau.
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Caméra, micro et partage d'écran restent autorisés pour l'instance
# elle-même — c'est sa raison d'être — et refusés à tout tiers embarqué.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), interest-cohort=()" always;

# Les fichiers de configuration et l'historique Git ne sont pas servis.
# Jitsi traite toute URL inconnue comme un nom de salle : sans ces règles,
# /.env répond 200 avec la page d'accueil. Ce n'est pas une fuite, mais
# une salle nommée « .env » n'a aucune raison d'exister.
location ~ /\.(env|git) {
    deny all;
    return 404;
}
