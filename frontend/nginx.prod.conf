server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flyer officiel FEBA FHA : toujours une pièce jointe, jamais un
    # affichage dans l'onglet. Voir nginx/nginx.prod.conf — la règle est
    # posée aux deux étages pour que le téléchargement fonctionne aussi
    # lorsque ce conteneur est servi sans le proxy externe devant lui.
    location = /images/feba-fha/feba-fha-flyer.pdf {
        try_files $uri =404;
        default_type application/pdf;
        add_header Content-Disposition
            'attachment; filename="FEBA-French-Heritage-Academy-flyer.pdf"' always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Médias statiques : un fichier absent doit se VOIR ─────────────
    #
    # Le repli « /index.html » du SPA capture aussi les fichiers. Une
    # image ou un document manquant répondait donc « 200 » avec la page
    # de l'application : un lien cassé passait pour un lien qui marche,
    # et ni le visiteur ni la supervision ne le voyaient. La V8 avait
    # traité le seul flyer ; la règle vaut pour tout le dossier.
    #
    # Aucune route de l'application ne vit sous /images/ : le repli SPA
    # n'y a rien à rattraper.
    location /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
