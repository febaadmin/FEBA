services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: feba_postgres_prod
    environment:
      POSTGRES_DB: feba_prod
      POSTGRES_USER: feba_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feba_user -d feba_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-prod:
    image: redis:7-alpine
    container_name: feba_redis_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: feba_backend_prod
    env_file: .env.prod
    volumes:
      - media_prod:/app/media
      # Fichiers PRIVÉS (fiches FHA, pièces jointes des e-mails) : hors du
      # média public, et PARTAGÉS avec le worker Celery qui envoie les
      # e-mails. Sans ce volume, ils vivaient dans le système de fichiers
      # du conteneur : perdus à la reconstruction et invisibles du worker.
      - private_media_prod:/app/private_media
      - static_prod:/app/staticfiles
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    command: python /app/entrypoint.prod.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: feba_celery_prod
    env_file: .env.prod
    volumes:
      - media_prod:/app/media
      - private_media_prod:/app/private_media
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped
    # Même contrôle de configuration que le backend : un worker mal configuré
    # (transport e-mail de test, SMS de capture…) ne démarre pas.
    command: sh -c "python manage.py production_preflight --quiet && exec celery -A feba_project worker --loglevel=info --concurrency=2"
    healthcheck:
      # Le worker répond-il au broker ? (envois groupés, relances, rapports)
      test: ["CMD-SHELL", "celery -A feba_project inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1"]
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: feba_celery_beat
    env_file: .env.prod
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped
    # Fichier d'état explicite : sert au contrôle de santé ci-dessous. Les
    # relances de paiement et la reprise des envois groupés dépendent de
    # Beat ; un planificateur figé ne doit plus passer inaperçu.
    command: sh -c "python manage.py production_preflight --quiet && exec celery -A feba_project beat --loglevel=info --schedule=/tmp/celerybeat-schedule"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; f='/tmp/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 900 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: feba_frontend_prod
    restart: unless-stopped
    expose:
      - "80"

  nginx-prod:
    image: nginx:1.25-alpine
    container_name: feba_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Vhosts additionnels, vides par défaut (voir nginx.prod.conf).
      # Permet d'activer meet.globalfeba.com sans toucher au fichier
      # principal quand Jitsi tourne sur ce même serveur.
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - static_prod:/var/www/static:ro
      - media_prod:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Défis ACME (renouvellement Let's Encrypt SANS arrêter nginx) :
      # certbot écrit ici, nginx sert /.well-known/acme-challenge/.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend-prod:
        condition: service_healthy
      frontend-prod:
        condition: service_started
    restart: unless-stopped

volumes:
  private_media_prod:
  postgres_prod_data:
  media_prod:
  static_prod:
