name: Deploy FEBA Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: feba-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI — tests et contrôles avant production
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/feba_deploy
          chmod 600 ~/.ssh/feba_deploy

          ssh-keyscan \
            -p "$SERVER_PORT" \
            -H "$SERVER_HOST" \
            >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          # Le commit EXACT validé par le job « ci » ci-dessus.
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          case "$DEPLOY_SHA" in (*[!0-9a-f]*|"") echo "SHA invalide"; exit 1;; esac
          ssh \
            -i ~/.ssh/feba_deploy \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/feba/app/FEBA

          echo "==> Identification du dernier snapshot Restic"
          snapshot_before="$(sudo -n /usr/bin/restic snapshots \
              --repo /opt/feba/backups/restic-repository \
              --password-file /root/.feba-restic-password \
              --latest 1 \
              --json \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data[-1]["short_id"] if data else "")')"

          echo "Snapshot avant sauvegarde : ${snapshot_before:-aucun}"

          echo "==> Sauvegarde Restic pré-déploiement"
          sudo -n /usr/bin/systemctl start feba-backup.service

          backup_result="$(sudo -n /usr/bin/systemctl show \
            feba-backup.service \
            --property=Result \
            --value)"

          exec_status="$(sudo -n /usr/bin/systemctl show \
            feba-backup.service \
            --property=ExecMainStatus \
            --value)"

          echo "Résultat du service : $backup_result"
          echo "Code de sortie : $exec_status"

          if [ "$backup_result" != "success" ] || [ "$exec_status" != "0" ]; then
            echo "ERREUR : la sauvegarde pré-déploiement a échoué."
            sudo -n /usr/bin/systemctl status feba-backup.service --no-pager -l || true
            sudo -n /usr/bin/journalctl -u feba-backup.service -n 100 --no-pager || true
            exit 1
          fi

          echo "Sauvegarde pré-déploiement terminée avec succès."

          snapshot_after="$(sudo -n /usr/bin/restic snapshots \
              --repo /opt/feba/backups/restic-repository \
              --password-file /root/.feba-restic-password \
              --latest 1 \
              --json \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data[-1]["short_id"] if data else "")')"

          echo "Snapshot après sauvegarde : ${snapshot_after:-aucun}"

          if [ -z "$snapshot_after" ] || [ "$snapshot_after" = "$snapshot_before" ]; then
            echo "ERREUR : aucun nouveau snapshot Restic n'a été créé."
            exit 1
          fi

          echo "==> Récupération du code"
          # On déploie le commit TESTÉ, pas « origin/main » au moment de
          # l'exécution : un push arrivé pendant la CI aurait sinon été mis
          # en production sans avoir été validé.
          git fetch origin main
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "ERREUR : $DEPLOY_SHA n'appartient pas à origin/main."
            exit 1
          fi
          previous_sha="$(git rev-parse HEAD)"
          echo "Version en service : $previous_sha → version déployée : $DEPLOY_SHA"
          echo "$previous_sha" > .previous_deploy_sha
          git reset --hard "$DEPLOY_SHA"

          echo "==> Validation de Docker Compose"
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            config >/dev/null

          # Incident du 28/10/2026 : « up --build » remplaçait les conteneurs
          # AVANT de savoir si la nouvelle image acceptait la configuration
          # (.env.prod). Le nouveau backend s'arrêtait au contrôle de
          # configuration, nginx ne redémarrait pas : site hors ligne, et
          # « set -e » quittait avant d'afficher les journaux du backend.
          # Désormais : construire, contrôler la configuration dans un
          # conteneur jetable, et ne basculer qu'ensuite.
          compose() {
            docker compose --env-file .env.prod -f docker-compose.prod.yml "$@"
          }

          restore_previous() {
            echo "==> Version précédente conservée : $previous_sha"
            git reset --hard "$previous_sha"
            for image in feba-backend feba-frontend; do
              if docker image inspect "$image:previous" >/dev/null 2>&1; then
                docker tag "$image:previous" "$image:current"
              fi
            done
          }

          echo "==> Image en service conservée sous le tag « previous »"
          for image in feba-backend feba-frontend; do
            if docker image inspect "$image:current" >/dev/null 2>&1; then
              docker tag "$image:current" "$image:previous"
            fi
          done

          echo "==> Construction des images (les conteneurs en service restent actifs)"
          # Sans attestation de provenance (horodatée), une construction entièrement en cache
          # redonne le même identifiant d'image : nginx inchangé est alors reconnu comme tel
          # (déploiements #66 à #68 : même configuration 1b23d44b, trois identifiants différents).
          export BUILDX_NO_DEFAULT_ATTESTATIONS=1
          if ! compose build; then
            echo "ERREUR : construction impossible. Rien n'a été remplacé."
            restore_previous
            exit 1
          fi

          echo "==> Contrôle de la configuration de production avec la nouvelle image"
          if ! compose run --rm --no-deps -T backend-prod \
              python manage.py production_preflight --network </dev/null; then
            echo "ERREUR : la nouvelle version refuse la configuration de .env.prod."
            echo "Rien n'a été remplacé ; corriger .env.prod puis relancer le déploiement."
            restore_previous
            exit 1
          fi

          # Bascule sans coupure. Le backend met une quinzaine de secondes à démarrer (contrôles,
          # migrations, fichiers statiques) : le remplacer directement donnait des 502 tout ce temps.
          # Un relais démarre donc la nouvelle image à côté de l'ancienne, sous le même nom réseau,
          # et l'ancienne n'est remplacée qu'une fois le relais sain. S'il échoue, elle reste en service.
          # Mesure en charge : 260 réponses 502 avant, 0 après (voir RAPPORT_DISPONIBILITE_502.md).
          # Le backend tourne sans privilège (uid 10001) : les volumes lui sont attribués. Idempotent ;
          # une image plus ancienne, exécutée en root, continue d'y écrire en cas de retour arrière.
          echo "==> Volumes attribués à l'utilisateur du backend"
          compose run --rm --no-deps -T --user root --entrypoint sh backend-prod \
            -c 'chown -R 10001:10001 /app/media /app/private_media /app/staticfiles' </dev/null

          # Un relais par service servi par nginx : la nouvelle image démarre à côté de l'ancienne, sous
          # le même nom réseau, et l'ancienne n'est remplacée qu'une fois le relais sain.
          relais="feba_backend_relais feba_frontend_relais"
          trap 'docker rm -f $relais >/dev/null 2>&1 || true' EXIT
          docker rm -f $relais >/dev/null 2>&1 || true
          demarrer_relais() {
            nom="$1"; service="$2"
            echo "==> Relais $service avec la nouvelle version"
            compose run -d --no-deps --use-aliases --name "$nom" "$service" </dev/null >/dev/null
            for attempt in $(seq 1 36); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$nom" 2>/dev/null || echo absent)"
              echo "Relais $service, tentative $attempt/36 : $status"
              case "$status" in healthy|running) [ "$service" = frontend-prod ] && [ "$status" = running ] && sleep 3; return 0 ;; esac
              if [ "$attempt" -eq 36 ] || [ "$status" = "unhealthy" ] || [ "$status" = "absent" ] || [ "$status" = "exited" ]; then
                echo "ERREUR : la nouvelle version de $service ne démarre pas. L'ancienne reste en service."
                docker logs "$nom" --tail=200 || true
                restore_previous
                exit 1
              fi
              sleep 5
            done
          }
          demarrer_relais feba_backend_relais backend-prod
          demarrer_relais feba_frontend_relais frontend-prod

          # nginx n'est PAS touché ici : sinon Compose l'arrête pendant tout le remplacement du backend
          # (coupure mesurée en production le 03/11 : 17 s). Il est traité seul, plus bas.
          echo "==> Démarrage de la nouvelle version"
          if ! compose up -d --no-deps --remove-orphans backend-prod celery-prod celery-beat frontend-prod; then
            echo "ERREUR : la nouvelle version n'a pas démarré."
            compose ps || true
            compose logs backend-prod --tail=200 || true
            exit 1
          fi

          echo "==> Attente du backend"
          for attempt in $(seq 1 30); do
            status="$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              feba_backend_prod 2>/dev/null || true)"

            echo "Tentative $attempt/30 : $status"

            if [ "$status" = "healthy" ]; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "ERREUR : le backend n'est pas devenu sain."

              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                ps

              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                logs backend-prod --tail=150

              exit 1
            fi

            sleep 10
          done

          # Recréé seulement si son image, sa configuration ou sa définition Compose a changé : la
          # recréation coupe les connexions environ 1 s (mesuré en production le 03/11). Le premier
          # déploiement sans attestation recrée nginx une dernière fois (ancien identifiant).
          image_en_service="$(docker inspect --format '{{.Image}}' feba_nginx_prod 2>/dev/null || true)"
          image_construite="$(docker image inspect --format '{{.Id}}' feba-nginx:current 2>/dev/null || true)"
          if [ -n "$image_en_service" ] && [ "$image_en_service" = "$image_construite" ] \
             && git diff --quiet "$previous_sha" HEAD -- nginx/ docker-compose.prod.yml; then
            echo "==> nginx inchangé : conservé"
          else
            echo "==> nginx : mise à jour"
            conteneur_avant="$(docker inspect -f '{{.Id}}' feba_nginx_prod 2>/dev/null || true)"
            compose up -d --no-deps nginx-prod
            # « up » ne recrée que si l'image ou la définition a changé : seule une recréation
            # effective (nouveau conteneur) dispense du redémarrage pour la configuration.
            if [ "$(docker inspect -f '{{.Id}}' feba_nginx_prod 2>/dev/null || true)" != "$conteneur_avant" ]; then
              nginx_recree=1
            fi
          fi

          echo "==> Fin des relais : les requêtes en cours se terminent"
          docker stop -t 30 $relais >/dev/null 2>&1 || true
          docker rm $relais >/dev/null 2>&1 || true

          echo "==> Vérification de la configuration Django"
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            exec -T backend-prod \
            python manage.py check </dev/null

          echo "==> Vérification des migrations restantes"
          migration_plan="$(docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            exec -T backend-prod \
            python manage.py migrate --plan </dev/null)"

          printf '%s\n' "$migration_plan"

          if ! printf '%s\n' "$migration_plan" | grep -q "No planned migration operations"; then
            echo "ERREUR : des migrations restent à appliquer après le déploiement."
            exit 1
          fi

          # Panne du 03/11/2026 : le worker et le planificateur redémarraient en boucle
          # (VersionMismatch kombu/redis-py) sans que le déploiement le voie.
          echo "==> Vérification de Celery (worker et planificateur)"
          for attempt in $(seq 1 12); do
            if compose exec -T celery-prod celery -A feba_project inspect ping -t 5 </dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "ERREUR : le worker Celery ne répond pas."
              compose logs celery-prod celery-beat --tail=80
              exit 1
            fi
            sleep 5
          done
          sleep 20
          etat_beat="$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' feba_celery_beat)"
          echo "Planificateur : en marche, redémarrages = $etat_beat"
          if [ "$etat_beat" != "true 0" ]; then
            echo "ERREUR : le planificateur Celery ne tient pas."
            compose logs celery-beat --tail=80
            exit 1
          fi

          # nginx résout le backend à chaque requête : le redémarrer n'est utile que si sa
          # configuration a changé, et coupe sinon toutes les connexions pour rien.
          if git diff --quiet "$previous_sha" HEAD -- nginx/; then
            echo "==> Configuration Nginx inchangée : pas de redémarrage"
          elif [ "${nginx_recree:-0}" = 1 ]; then
            # Recréé plus haut : il a déjà lu la nouvelle configuration. Un redémarrage
            # ajouterait une seconde coupure (constaté sur le journal du 04/11).
            echo "==> Nginx recréé avec la nouvelle configuration : pas de second redémarrage"
          else
            echo "==> Redémarrage de Nginx : configuration modifiée"
            compose restart nginx-prod
            sleep 8
          fi

          echo "==> Vérification HTTPS"
          for attempt in $(seq 1 6); do
            if curl \
              --fail \
              --silent \
              --show-error \
              https://globalfeba.com/api/health/
            then
              echo
              echo "API HTTPS disponible."
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "ERREUR : l'API HTTPS reste indisponible après 6 tentatives."

              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                ps

              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                logs nginx-prod backend-prod --tail=150

              exit 1
            fi

            echo "Tentative $attempt/6 échouée, nouvel essai dans 5 secondes..."
            sleep 5
          done

          echo "==> Vérification du site public"
          for attempt in $(seq 1 6); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --output /dev/null \
              https://globalfeba.com/
            then
              echo "Site public disponible."
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "ERREUR : le site public reste indisponible après 6 tentatives."
              exit 1
            fi

            echo "Tentative $attempt/6 échouée, nouvel essai dans 5 secondes..."
            sleep 5
          done

          echo
          echo "==> État final"
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps

          echo "==> Nettoyage des images inutilisées"
          docker image prune -f

          echo "Déploiement terminé avec succès."
          REMOTE
