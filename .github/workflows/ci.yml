# ══════════════════════════════════════════════════════════════════════
# Validation des Pull Requests.
#
# CE WORKFLOW EST NOUVEAU EN V9.
#
# Jusqu'ici le dépôt n'avait qu'un seul workflow, `deploy.yml`, déclenché
# par un push sur `main`. Autrement dit : une Pull Request n'était
# validée par rien, et la première exécution des tests avait lieu APRÈS
# la fusion — au moment du déploiement en production.
#
# Celui-ci ne déploie rien et ne touche à rien : il lit, installe,
# compile et teste. `deploy.yml` reste seul responsable de la production
# et n'est pas modifié.
#
# AUCUN SECRET DE PRODUCTION N'EST REQUIS.
# Les valeurs ci-dessous sont des valeurs de test, jetables, cantonnées
# au conteneur de la CI. Une Pull Request venue d'un fork doit pouvoir
# être validée sans qu'on lui confie quoi que ce soit.
# ══════════════════════════════════════════════════════════════════════
name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore:
      # `main` est déjà couvert par deploy.yml, qui rejoue les tests
      # avant de déployer. Inutile de payer deux fois la même validation.
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une nouvelle poussée annule la validation en cours de la même
  # branche : c'est le dernier état qui compte.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feba_user
          POSTGRES_PASSWORD: feba_dev_pass
          POSTGRES_DB: feba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feba_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # SMTP de TEST : sans lui, les tests d'envoi réel étaient ignorés.
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ["1025:1025", "8025:8025"]

    env:
      # Valeurs de TEST uniquement — jamais celles de production.
      SECRET_KEY: ci-secret-key-not-for-production-use-000000000000000000
      DATABASE_URL: postgresql://feba_user:feba_dev_pass@localhost:5432/feba_test
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TEST_DB_NAME: feba_test
      TEST_DB_USER: feba_user
      TEST_DB_PASSWORD: feba_dev_pass
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_API_URL: http://localhost:8025
      # LibreOffice absent = ÉCHEC, et non tests ignorés en silence.
      FEBA_REQUIRE_LIBREOFFICE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # MÊME version que les images Docker (python:3.12-slim) : la CI
          # testait en 3.11 un code exécuté en 3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: LibreOffice et polices (comme backend/Dockerfile.prod)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer-nogui libreoffice-impress-nogui \
            fonts-dejavu-core fonts-liberation fonts-liberation2 \
            fonts-crosextra-carlito fonts-crosextra-caladea
          soffice --version

      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Contrôles Django
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      # Apport de la PR #13 : les migrations sont jouées par « migrate », comme
      # au déploiement (entrypoint.prod.py), sur une base PostgreSQL vide —
      # pas seulement par la création de la base de test de pytest. Aucune
      # opération ne doit rester ensuite.
      - name: Migrations sur base vide (comme en production)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        run: |
          python manage.py migrate --noinput
          plan="$(python manage.py migrate --plan)"
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" | grep -q "No planned migration operations"

      - name: Suite backend — PostgreSQL
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        # Aucun « || true » : un échec doit faire échouer la validation.
        # -rs : chaque test ignoré est listé avec sa raison dans le journal.
        run: pytest tests -q -rs

      - name: Suite backend — SQLite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_sqlite
        run: pytest tests -q -rs

      - name: Bulletin sur une page et délai de conversion (contrôle bloquant explicite)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        run: pytest -q -rs tests/test_bulletin_one_page.py tests/test_bulletin_layout.py "tests/test_template_conversion.py::GlobalDeadlineTests" "tests/test_template_conversion.py::OfficeErrorTests::test_delai_de_conversion_depasse"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        # Le dépôt porte des avertissements préexistants ; seules les
        # ERREURS bloquent. `--max-warnings` n'est volontairement pas
        # fixé à 0 : ce serait transformer une dette connue en blocage
        # sans l'avoir traitée.
        run: npm run lint

      - name: Build de production
        working-directory: frontend
        run: npm run build

  security:
    name: Sécurité des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: pip-audit (dépendances de production)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements/base.txt --progress-spinner off
          grep -v '^-r' backend/requirements/prod.txt > /tmp/prod.txt
          pip-audit -r /tmp/prod.txt --progress-spinner off
      - name: npm audit (dépendances livrées, sévérité haute ou critique)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images Docker de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images (aucune publication)
        run: |
          docker build -f backend/Dockerfile.prod -t feba-backend:ci backend
          docker build -f frontend/Dockerfile.prod -t feba-frontend:ci frontend
      - name: L'image backend démarre et voit ses dépendances
        run: |
          docker run --rm --entrypoint sh feba-backend:ci -c \
            'python --version && soffice --version && python -c "import django, reportlab, pypdf; print(django.get_version())"'

  configuration:
    name: Configuration et sûreté du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour la recherche de secrets

      - name: Aucun secret dans le dépôt ni son historique
        # Constats anciens examinés et listés dans .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect \
            --source /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore

      - name: Fichiers Docker Compose valides
        # Le script fournit les valeurs de test que les fichiers exigent
        # (env_file absents du dépôt, variables « ${VAR:?} » des
        # surcouches Jitsi) et les retire ensuite. Un « docker compose
        # config » nu échouerait ici — à juste titre.
        run: bash scripts/compose_config_check.sh

      - name: Configuration Jitsi cohérente
        run: bash scripts/jitsi_config_check.sh

      - name: Configurations Nginx valides
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
          # Le vhost du site principal référence des certificats absents
          # de la CI : on contrôle la SYNTAXE, avec des chemins de test.
          work="$(mktemp -d)"

          # Les upstreams Docker n'existent pas sur le runner GitHub.
          # nginx -t exige seulement qu'ils soient résolvables.
          echo "127.0.0.1 frontend-prod backend-prod" | sudo tee -a /etc/hosts >/dev/null

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$work/k.pem" -out "$work/c.pem" -subj "/CN=ci" 2>/dev/null
          mkdir -p "$work/sites-enabled" "$work/logs" "$work/run"
          sed -e "s#/etc/letsencrypt/live/[^/]*/fullchain.pem#$work/c.pem#g" \
              -e "s#/etc/letsencrypt/live/[^/]*/privkey.pem#$work/k.pem#g" \
              -e "s#include /etc/nginx/sites-enabled/\*.conf;#include $work/sites-enabled/*.conf;#" \
              -e "s#error_log /var/log/nginx/error.log warn;#error_log $work/logs/e.log warn;#" \
              -e "s#pid /var/run/nginx.pid;#pid $work/run/n.pid;#" \
              -e "s#^user nginx;#user root;#" \
              nginx/nginx.prod.conf > "$work/nginx.conf"
          sudo nginx -t -c "$work/nginx.conf" -p "$work"
          # Et le vhost Jitsi, activé, pour qu'une erreur y soit vue ici
          # plutôt que sur le serveur qui sert aussi le site principal.
          sed -e "s#/etc/letsencrypt/live/[^/]*/fullchain.pem#$work/c.pem#g" \
              -e "s#/etc/letsencrypt/live/[^/]*/privkey.pem#$work/k.pem#g" \
              nginx/sites-available/meet.globalfeba.com.conf \
              > "$work/sites-enabled/meet.conf"
          sudo nginx -t -c "$work/nginx.conf" -p "$work"

      - name: Aucun secret ni artefact indésirable
        run: bash scripts/repo_safety_check.sh
