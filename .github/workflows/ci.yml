# ══════════════════════════════════════════════════════════════════════
# Validation des Pull Requests.
#
# CE WORKFLOW EST NOUVEAU EN V9.
#
# Jusqu'ici le dépôt n'avait qu'un seul workflow, `deploy.yml`, déclenché
# par un push sur `main`. Autrement dit : une Pull Request n'était
# validée par rien, et la première exécution des tests avait lieu APRÈS
# la fusion — au moment du déploiement en production.
#
# Celui-ci ne déploie rien et ne touche à rien : il lit, installe,
# compile et teste. `deploy.yml` reste seul responsable de la production
# et n'est pas modifié.
#
# AUCUN SECRET DE PRODUCTION N'EST REQUIS.
# Les valeurs ci-dessous sont des valeurs de test, jetables, cantonnées
# au conteneur de la CI. Une Pull Request venue d'un fork doit pouvoir
# être validée sans qu'on lui confie quoi que ce soit.
# ══════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      # `main` est déjà couvert par deploy.yml, qui rejoue les tests
      # avant de déployer. Inutile de payer deux fois la même validation.
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une nouvelle poussée annule la validation en cours de la même
  # branche : c'est le dernier état qui compte.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feba_user
          POSTGRES_PASSWORD: feba_dev_pass
          POSTGRES_DB: feba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feba_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valeurs de TEST uniquement — jamais celles de production.
      SECRET_KEY: ci-secret-key-not-for-production-use-000000000000000000
      DATABASE_URL: postgresql://feba_user:feba_dev_pass@localhost:5432/feba_test
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TEST_DB_NAME: feba_test
      TEST_DB_USER: feba_user
      TEST_DB_PASSWORD: feba_dev_pass
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Contrôles Django
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Suite backend — PostgreSQL
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_postgres
        # Aucun « || true » : un échec doit faire échouer la validation.
        run: pytest tests -q

      - name: Suite backend — SQLite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: feba_project.settings.test_sqlite
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        # Le dépôt porte des avertissements préexistants ; seules les
        # ERREURS bloquent. `--max-warnings` n'est volontairement pas
        # fixé à 0 : ce serait transformer une dette connue en blocage
        # sans l'avoir traitée.
        run: npm run lint

      - name: Build de production
        working-directory: frontend
        run: npm run build

  configuration:
    name: Configuration et sûreté du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fichiers Docker Compose valides
        # Le script fournit les valeurs de test que les fichiers exigent
        # (env_file absents du dépôt, variables « ${VAR:?} » des
        # surcouches Jitsi) et les retire ensuite. Un « docker compose
        # config » nu échouerait ici — à juste titre.
        run: bash scripts/compose_config_check.sh

      - name: Configuration Jitsi cohérente
        run: bash scripts/jitsi_config_check.sh

      - name: Configurations Nginx valides
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
          # Le vhost du site principal référence des certificats absents
          # de la CI : on contrôle la SYNTAXE, avec des chemins de test.
          work="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$work/k.pem" -out "$work/c.pem" -subj "/CN=ci" 2>/dev/null
          mkdir -p "$work/sites-enabled" "$work/logs" "$work/run"
          sed -e "s#/etc/letsencrypt/live/[^/]*/fullchain.pem#$work/c.pem#g" \
              -e "s#/etc/letsencrypt/live/[^/]*/privkey.pem#$work/k.pem#g" \
              -e "s#include /etc/nginx/sites-enabled/\*.conf;#include $work/sites-enabled/*.conf;#" \
              -e "s#error_log /var/log/nginx/error.log warn;#error_log $work/logs/e.log warn;#" \
              -e "s#pid /var/run/nginx.pid;#pid $work/run/n.pid;#" \
              -e "s#^user nginx;#user root;#" \
              nginx/nginx.prod.conf > "$work/nginx.conf"
          sudo nginx -t -c "$work/nginx.conf" -p "$work"
          # Et le vhost Jitsi, activé, pour qu'une erreur y soit vue ici
          # plutôt que sur le serveur qui sert aussi le site principal.
          sed -e "s#/etc/letsencrypt/live/[^/]*/fullchain.pem#$work/c.pem#g" \
              -e "s#/etc/letsencrypt/live/[^/]*/privkey.pem#$work/k.pem#g" \
              nginx/sites-available/meet.globalfeba.com.conf \
              > "$work/sites-enabled/meet.conf"
          sudo nginx -t -c "$work/nginx.conf" -p "$work"

      - name: Aucun secret ni artefact indésirable
        run: bash scripts/repo_safety_check.sh
