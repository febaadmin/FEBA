# ══════════════════════════════════════════════════════════════════════
# Aiguilleur 80/443 du serveur vidéo partagé (Jitsi + plugNmeet).
#
# 443 : routage par NOM (SNI) SANS déchiffrer TLS — chaque service garde son
#       certificat et sa clé ; l'aiguilleur n'en détient aucun.
# 80  : routage par en-tête Host. Les défis Let's Encrypt (certbot) sont
#       servis ICI depuis /var/www/certbot ; pour meet, un défi absent de ce
#       dossier est transmis à Jitsi, qui renouvelle lui-même (acme.sh).
#
# ÉTAT DE PRODUCTION : meet.globalfeba.com → plugNmeet (pnm-web).
# Retour arrière : nginx.jitsi.conf (meet → Jitsi), recopié DANS ce fichier
# par « meet_plugnmeet.sh aiguilleur jitsi », puis rechargé.
#
# Réseau hôte : les services sont joints sur 127.0.0.1 (ports publiés en
# boucle locale par docker-compose.jitsi.edge.yml et
# plugnmeet/docker-compose.plugnmeet.edge.yml).
# Validation : docker run --rm -v $PWD/plugnmeet/edge:/etc/nginx/feba:ro nginx:1.27.5-alpine nginx -t -c /etc/nginx/feba/nginx.conf
# ══════════════════════════════════════════════════════════════════════
worker_processes auto;
events { worker_connections 4096; }

stream {
    map $ssl_preread_server_name $feba_backend {
        meet.globalfeba.com  127.0.0.1:9443;
        pnm.globalfeba.com   127.0.0.1:9443;   # ancien nom, même certificat
        default              127.0.0.1:9443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $feba_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;               # signalisation WebSocket des réunions
    }
}

http {
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name meet.globalfeba.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri @jitsi;
        }
        location / {
            return 301 https://$host$request_uri;
        }
        # Jitsi reste en place pour le retour arrière : son renouvellement
        # acme.sh continue de passer par ici.
        location @jitsi {
            proxy_pass http://127.0.0.1:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name pnm.globalfeba.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
