# Aiguilleur 80/443 (voir nginx.conf). Démarré SEULEMENT pendant la fenêtre
# de bascule, après docker-compose.jitsi.edge.yml (qui libère 80/443).
#   docker compose -f plugnmeet/edge/docker-compose.edge.yml up -d
name: feba-edge
services:
  edge:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: feba-edge
    network_mode: host
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    # Le DOSSIER est monté, pas le fichier : un « git pull » remplace
    # nginx.conf par un nouveau fichier (nouvel inode) qu'un montage de
    # fichier ne verrait jamais. Prise en compte : nginx -t puis reload.
    command: ["nginx", "-c", "/etc/nginx/feba/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./:/etc/nginx/feba:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 3s
      retries: 4
