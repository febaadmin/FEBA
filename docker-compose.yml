services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: feba_postgres_dev
    environment:
      POSTGRES_DB: feba_dev
      POSTGRES_USER: feba_user
      POSTGRES_PASSWORD: feba_dev_pass
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feba_user -d feba_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: feba_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── P3 — Boîte de réception locale ────────────────────────────────
  #
  # Mailpit reçoit les messages du développement au lieu de les écrire
  # dans la console. Ce n'est pas un confort : c'est ce qui permet de
  # VÉRIFIER un envoi — destinataire, objet, langue, pièce jointe, type
  # MIME — au lieu de supposer qu'il a eu lieu. Un rapport mensuel dont
  # on ne peut pas ouvrir la pièce jointe n'est pas un rapport envoyé.
  #
  # Aucun secret ici : Mailpit ne relaie rien vers l'extérieur.
  mailpit:
    image: axllent/mailpit:latest
    container_name: feba_mailpit_dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web et API de lecture
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      # `wget` est présent dans l'image ; on interroge l'API de lecture,
      # qui ne répond que si le service est réellement prêt.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ── P5 — Propriétaire UNIQUE des migrations ─────────────────────────
  #
  # PROBLÈME RÉSOLU : `backend-dev` migrait automatiquement au démarrage
  # (`entrypoint.dev.py`) PENDANT que `scripts/bootstrap.sh` lançait sa
  # propre commande `manage.py migrate` en parallèle — deux processus
  # de migration concurrents sur une base neuve, d'où
  # `relation "schedule_onlinesessionschedule" already exists`.
  #
  # Ce service one-shot est désormais le SEUL à migrer. `backend-dev`,
  # `celery-dev` et `celery-beat-dev` attendent tous
  # `service_completed_successfully` avant de démarrer — jamais une
  # deuxième migration en parallèle de la leur.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: feba_migrate_dev
    env_file: .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      postgres-dev:
        condition: service_healthy
    command: python manage.py migrate --noinput
    restart: "no"

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: feba_backend_dev
    env_file: .env.dev
    volumes:
      - ./backend:/app
      - media_dev:/app/media
    ports:
      - "8000:8000"
    # P7 — Réseau partagé avec Jitsi (docker-compose.jitsi.yml, stack
    # indépendante). Sans ce réseau commun, « jitsi-web » n'a AUCUN moyen
    # d'être joint par son nom depuis ce conteneur — ce n'était pas
    # seulement une histoire de mauvaise URL, le réseau lui-même manquait.
    # `default` reste attaché explicitement : Compose ne l'ajoute plus
    # automatiquement dès qu'un service déclare une liste `networks`.
    networks:
      - default
      - feba_jitsi_shared
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python /app/entrypoint.dev.py
    healthcheck:
      # N'utilise PAS curl (absent de l'image python:3.12-slim, pour
      # ne pas alourdir l'image avec un paquet supplémentaire) — un
      # one-liner Python suffit et est toujours disponible.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: feba_celery_dev
    env_file: .env.dev
    volumes:
      - ./backend:/app
      - media_dev:/app/media
    depends_on:
      backend-dev:
        # Attendre que le backend soit RÉELLEMENT opérationnel (migrations
        # appliquées + serveur qui répond), pas seulement démarré. Évite
        # que Celery ne se lance en parallèle d'un backend en échec et ne
        # masque l'erreur réelle derrière un deuxième crash redondant.
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A feba_project worker --loglevel=info
    healthcheck:
      # P8 — CORRIGÉ : l'ancienne commande ciblait un destinataire précis
      # avec `-d celery@$$HOSTNAME`. En forme exec (`CMD`), Docker
      # n'exécute PAS de shell : `$HOSTNAME` n'est donc JAMAIS développé,
      # et Celery cherchait un worker nommé littéralement
      # « celery@$HOSTNAME » — qui n'existe jamais. Le contrôle échouait
      # donc TOUJOURS, quel que soit l'état réel du worker.
      #
      # Sans `-d`, `inspect ping` interroge TOUS les workers disponibles
      # et réussit dès qu'un seul répond — exactement la commande de
      # référence de la demande d'origine, et suffisant ici puisqu'un
      # seul worker tourne dans ce conteneur.
      test: ["CMD", "celery", "-A", "feba_project", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  celery-beat-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: feba_celery_beat_dev
    env_file: .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      backend-dev:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A feba_project beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      # Beat n'expose pas d'API. On vérifie que son fichier d'état a été
      # écrit récemment : un planificateur figé ne le met plus à jour, et
      # c'est exactement la panne qui passe inaperçue — aucun rapport ne
      # part, et rien ne le signale.
      test: ["CMD-SHELL", "python -c \"import os,time,sys; f='/tmp/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 900 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: feba_frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend-dev:
        condition: service_healthy
    # VITE_API_URL vide = Vite utilise son proxy intégré (/api → backend-dev:8000)
    # défini dans vite.config.js — c'est le mode correct pour le développement.
    # Ne PAS mettre http://localhost:8000 ici : ça bypasse le proxy et casse le
    # remplacement automatique de token 401.
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost:8000

volumes:
  postgres_dev_data:
  media_dev:

# P7 — Réseau partagé backend ↔ Jitsi. Créé ICI (pas « external » de ce
# côté) : docker-compose.yml est le premier des deux stacks démarré dans
# le pipeline normal (voir scripts/bootstrap.sh). docker-compose.jitsi.yml
# le référence en `external: true` et le crée lui-même si besoin (voir
# scripts/jitsi_up.sh) — utile si Jitsi est démarré avant le reste.
networks:
  default:
  feba_jitsi_shared:
    name: feba_jitsi_shared
